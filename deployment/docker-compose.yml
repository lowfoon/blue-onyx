services:
  blue-onyx:
    build:
      context: ..
      dockerfile: Dockerfile.openvino
    platform: linux/amd64
    image: blue-onyx:openvino-local
    container_name: blue-onyx
    ports:
      - "${BLUE_ONYX_BIND_IP:-127.0.0.1}:32168:32168"
    volumes:
      - config:/app/config
      - models:/app/models
    environment:
      - RUST_LOG=info
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    group_add:
      - "${RENDER_GID:?Set RENDER_GID to the host GPU render device group ID}"
    restart: unless-stopped
    stop_grace_period: 45s
volumes:
  config:
  models:
