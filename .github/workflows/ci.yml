name: ci
on:
  pull_request:
  push:
    branches: [main, 'fork/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archive: onnxruntime-linux-x64-1.29.0.tgz
          - os: macos-latest
            archive: onnxruntime-osx-arm64-1.29.0.tgz
          - os: windows-latest
            archive: onnxruntime-win-x64-1.29.0.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Download official prebuilt runtime
        shell: bash
        env:
          ARCHIVE: ${{ matrix.archive }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.29.0 --repo microsoft/onnxruntime --pattern "$ARCHIVE" --dir "$RUNNER_TEMP"
          if [[ "$ARCHIVE" == *.zip ]]; then
            unzip -q "$RUNNER_TEMP/$ARCHIVE" -d "$RUNNER_TEMP/ort"
          else
            mkdir -p "$RUNNER_TEMP/ort"
            tar -xzf "$RUNNER_TEMP/$ARCHIVE" -C "$RUNNER_TEMP/ort"
          fi
          LIB_DIR=$(find "$RUNNER_TEMP/ort" -type d -name lib -print -quit)
          echo "BLUE_ONYX_ORT_LIB_DIR=$LIB_DIR" >> "$GITHUB_ENV"
      - run: cargo fmt --all --check
      - run: cargo test --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings
  cuda-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Download CUDA runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.29.0 --repo microsoft/onnxruntime --pattern onnxruntime-linux-x64-gpu_cuda12-1.29.0.tgz --dir "$RUNNER_TEMP"
          echo '4ca594a0da83927befbd73fe020d7f569be151d70bb4fe9741ad405f4882e2ad  '"$RUNNER_TEMP/onnxruntime-linux-x64-gpu_cuda12-1.29.0.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/ort"
          tar -xzf "$RUNNER_TEMP/onnxruntime-linux-x64-gpu_cuda12-1.29.0.tgz" --strip-components=1 -C "$RUNNER_TEMP/ort"
          echo "BLUE_ONYX_ORT_LIB_DIR=$RUNNER_TEMP/ort/lib" >> "$GITHUB_ENV"
      - run: cargo test --locked --all-targets --features cuda
      - run: cargo clippy --locked --all-targets --features cuda -- -D warnings
  docker-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t blue-onyx:ci .
      - name: Verify container liveness and SIGTERM
        run: |
          docker run -d --name blueonyx-ci -p 127.0.0.1:32168:32168 blue-onyx:ci --model /missing/model.onnx
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:32168/health/live; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:32168/health/live
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:32168/health/ready)" = 503
          docker stop --time 10 blueonyx-ci
          test "$(docker inspect -f '{{.State.ExitCode}}' blueonyx-ci)" = 0
